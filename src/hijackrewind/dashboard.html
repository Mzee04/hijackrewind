<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HijackRewind</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.45 "Segoe UI", sans-serif; background: #f4f6f8; color: #1b1f24; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 16px 24px; background: #fff; border-bottom: 1px solid #d5dbe3; position: sticky; top: 0; }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 0 0 10px; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: #526070; }
  button, input { font: inherit; border-radius: 10px; border: 1px solid #c5ced8; background: #fff; padding: 10px 14px; }
  button { cursor: pointer; }
  button.kill { background: #c62828; color: #fff; border: 0; font-weight: 800; font-size: 22px; min-width: 220px; min-height: 64px; }
  button.kill:disabled { background: #8d8d8d; }
  main { display: grid; grid-template-columns: 1.3fr .7fr; gap: 16px; padding: 16px 24px 40px; }
  section { background: #fff; border: 1px solid #d5dbe3; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #e8eef6; font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  ol { margin: 0; padding-left: 22px; }
  li { margin: 8px 0; }
  .tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 14px; font-weight: 700; background: #eceff3; }
  .tag.auto { background: #d9f2e3; }
  .tag.held, .tag.approval { background: #fff3cd; }
  .tag.cancelled, .tag.in_flight { background: #f8d0d0; }
  .tag.rolled_back, .tag.rolled { background: #d6e4ff; }
  .tag.unavailable { background: #eceff3; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f7f9fb; padding: 12px; border-radius: 10px; max-height: 280px; overflow: auto; font-size: 14px; }
  .ok { color: #1b7f3b; font-weight: 700; }
  .bad { color: #c62828; font-weight: 700; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } header { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>HijackRewind</h1>
    <p id="mode">loading</p>
  </div>
  <button id="kill" class="kill" type="button">Kill switch</button>
</header>
<main>
  <div>
    <section>
      <h2>Incident</h2>
      <p><span class="pill" id="step">idle</span> <span id="run"></span></p>
      <p id="summary">No run yet.</p>
      <p id="cost">Rate-limit points this run: 0</p>
    </section>
    <section>
      <h2>Timeline</h2>
      <ol id="timeline"><li>none</li></ol>
    </section>
    <section>
      <h2>Start</h2>
      <form id="run-form" class="row">
        <input id="source" name="source" size="42" placeholder="sandbox/fixtures/genuine-new-ssh-key.eml" aria-label="Alert path">
        <button type="submit">Run</button>
        <button id="demo" type="button">Sandbox demo</button>
      </form>
    </section>
  </div>
  <div>
    <section>
      <h2>Actions</h2>
      <ol id="actions"><li>none</li></ol>
      <div class="row" style="margin-top:10px">
        <button id="approve" type="button">Approve held plan</button>
        <button id="deny" type="button">Deny</button>
      </div>
    </section>
    <section>
      <h2>Audit chain</h2>
      <p id="chain">checking</p>
      <pre id="audit">No events.</pre>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.querySelector(id);
let planId = "";

function tag(status) {
  const name = status || "noted";
  return '<span class="tag ' + name + '">' + name.replaceAll("_", " ") + "</span>";
}

function list(node, items, render) {
  node.replaceChildren();
  if (!items.length) {
    const li = document.createElement("li");
    li.textContent = "none";
    node.append(li);
    return;
  }
  for (const item of items) {
    const li = document.createElement("li");
    li.innerHTML = render(item);
    node.append(li);
  }
}

function statusFor(event) {
  const detail = event.detail || {};
  if (event.action === "tool_cancelled" || event.action === "run_cancelled") return "cancelled";
  if (event.action === "rolled_back") return "rolled_back";
  if (event.action === "action_planned") return "unavailable";
  if (event.action === "mutate_denied") return "held";
  if (event.action === "mutate_executed") return detail.status || "auto";
  if (event.action === "idempotent_noop") return "auto";
  return "noted";
}

async function tick() {
  const state = await (await fetch("/api/state")).json();
  const tail = await (await fetch("/api/audit")).json();
  const kill = state.kill || {};
  $("mode").textContent = (state.mode || "") + (kill.tripped ? " · kill switch tripped" : " · kill switch clear");
  $("kill").disabled = !!kill.tripped;
  const live = state.run || {};
  $("step").textContent = live.step || "idle";
  $("run").textContent = live.run_id || "";
  $("summary").textContent = live.summary || live.decision || "Waiting.";
  $("cost").textContent = "Rate-limit points this run: " + (live.cost_points || 0);
  const events = tail.events || [];
  list($("timeline"), events, (event) =>
    event.seq + " " + event.actor + " " + event.action + tag(statusFor(event))
  );
  const actions = events.filter((event) =>
    ["mutate_executed", "mutate_denied", "action_planned", "tool_cancelled", "rolled_back", "idempotent_noop"].includes(event.action)
  );
  list($("actions"), actions, (event) => {
    const detail = event.detail || {};
    const label = detail.path || detail.kind || event.action;
    return label + tag(statusFor(event));
  });
  planId = live.plan && live.plan.id || "";
  const chain = $("chain");
  chain.className = tail.ok ? "ok" : "bad";
  chain.textContent = tail.ok ? "Hash chain verified (" + (tail.detail || "") + ")" : "Hash chain failed (" + (tail.detail || "") + ")";
  $("audit").textContent = events.map((event) =>
    event.seq + " " + event.action + " " + (event.hash || "").slice(0, 12)
  ).join("\n") || "No events.";
}

async function post(url, body) {
  await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  tick();
}

$("kill").addEventListener("click", () => post("/api/kill", {reason: "dashboard button"}));
$("demo").addEventListener("click", () => post("/api/demo", {}));
$("approve").addEventListener("click", () => { if (planId) post("/api/plans/" + planId + "/approve", {}); });
$("deny").addEventListener("click", () => { if (planId) post("/api/plans/" + planId + "/deny", {}); });
$("run-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const source = new FormData(event.target).get("source");
  if (source) post("/api/runs", {source});
});
tick();
setInterval(tick, 400);
</script>
</body>
</html>
