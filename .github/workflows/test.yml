name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Dependency audit
        run: python -m pip install pip-audit==2.9.0 && python -m pip_audit -r requirements.txt
