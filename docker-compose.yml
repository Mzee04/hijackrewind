# Sandbox for HijackRewind. No credentials. The stub is a GitHub-shaped
# list/delete API. Mailpit is an optional local inbox.
services:
  github-stub:
    build:
      context: .
      dockerfile: sandbox/github_stub/Dockerfile
    ports:
      - "8088:8088"
    environment:
      STUB_HOST: "0.0.0.0"
      STUB_PORT: "8088"

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"
